name: Keep warm

# Pings the Render services so they don't spin down (free tier sleeps after ~15 min idle).
on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch:          # lets you run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping core service (Node)
        run: curl -s --max-time 90 https://tudummmm.onrender.com/health || true
      - name: Ping interview service (Java)
        run: curl -s --max-time 90 https://tudummmm-interview.onrender.com/actuator/health || true