services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tudummmm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tudummmm}
      POSTGRES_DB: ${POSTGRES_DB:-interview}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tudummmm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    volumes:
      - mongodata:/data/db

  backend:
    build: ./backend
    environment:
      PORT: 5001
      MONGODB_URI: mongodb://mongo:27017/tudummmm
      JWT_SECRET: ${JWT_SECRET}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
    ports:
      - "5001:5001"
    depends_on:
      - mongo

  interview-service:
    build: ./interview-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-interview}
      DB_USER: ${POSTGRES_USER:-tudummmm}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-tudummmm}
      JWT_SECRET: ${JWT_SECRET}
      GROQ_API_KEY: ${GROQ_API_KEY}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  mongodata: