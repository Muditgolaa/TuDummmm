spring.application.name=interview-service
server.port=${PORT:8080}

# --- PostgreSQL datasource (env-overridable, with dev defaults) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/interview}
spring.datasource.username=${DB_USER:tudummmm}
spring.datasource.password=${DB_PASSWORD:tudummmm}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# --- Actuator (health endpoint) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=${HEALTH_DETAILS:always}
# Shared JWT secret — MUST match the Node auth service's JWT_SECRET.
jwt.secret=${JWT_SECRET:}

# Groq API key — MUST match the Node backend's GROQ_API_KEY.
groq.api-key=${GROQ_API_KEY:}

# Auth is handled by our JWT filter, not the default user — silence the
# "generated security password" warning by excluding the default user auto-config.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration