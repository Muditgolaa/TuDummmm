spring.application.name=interview-service
server.port=8080

# --- PostgreSQL datasource (env-overridable, with dev defaults) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/interview}
spring.datasource.username=${DB_USER:tudummmm}
spring.datasource.password=${DB_PASSWORD:tudummmm}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Actuator (health endpoint) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Shared JWT secret — MUST match the Node auth service's JWT_SECRET.
jwt.secret=${JWT_SECRET:}

# Groq API key — MUST match the Node backend's GROQ_API_KEY.
groq.api-key=${GROQ_API_KEY:}